<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 用量监控</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <!-- 顶栏 -->
  <div class="header">
    <h1>📊 AI 用量监控</h1>
    <div class="header-actions">
      <button class="icon-btn" id="btn-refresh" title="刷新">🔄</button>
      <button class="icon-btn" id="btn-minimize" title="最小化到托盘">📥</button>
    </div>
  </div>

  <!-- 标签栏 -->
  <div class="tabs">
    <div class="tab active" data-tab="usage">用量详情</div>
    <div class="tab" data-tab="providers">厂商配置</div>
    <div class="tab" data-tab="add">添加厂商</div>
    <div class="tab" data-tab="settings">通用设置</div>
  </div>

  <!-- 用量详情 -->
  <div class="tab-content active" id="tab-usage">
    <div id="usage-content"></div>
    <div class="footer" id="footer"></div>
  </div>

  <!-- 厂商配置 -->
  <div class="tab-content" id="tab-providers">
    <div class="section-title">已配置的厂商</div>
    <div id="provider-list"></div>
  </div>

  <!-- 添加厂商 -->
  <div class="tab-content" id="tab-add">
    <div class="form-card">
      <div class="form-group">
        <label>选择厂商</label>
        <select id="provider-select"></select>
      </div>
      <div id="dynamic-fields"></div>
      <div class="form-group">
        <label>显示名称 (可选)</label>
        <input type="text" id="display-name" placeholder="例如：我的智谱账号">
      </div>
      <div style="display: flex; gap: 8px; margin-top: 16px;">
        <button class="btn btn-primary" id="btn-add">添加</button>
        <button class="btn btn-secondary" id="btn-test">测试查询</button>
      </div>
      <div class="test-result" id="test-result"></div>
    </div>
  </div>

  <!-- 通用设置 -->
  <div class="tab-content" id="tab-settings">
    <div class="form-card">
      <div class="section-title">刷新设置</div>
      <div class="setting-row">
        <div>
          <div class="label">自动刷新</div>
          <div class="desc">后台定时查询用量</div>
        </div>
        <div class="control">
          <label class="switch">
            <input type="checkbox" id="auto-refresh-toggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>
      <div class="setting-row">
        <div>
          <div class="label">刷新间隔</div>
          <div class="desc">单位：秒 (最小 10 秒)</div>
        </div>
        <div class="control">
          <input type="number" class="interval-input" id="refresh-interval" min="10" max="3600" step="10">
          <span style="color: var(--text-dim); font-size: 12px;">秒</span>
        </div>
      </div>
    </div>
    <div class="form-card">
      <div class="section-title">关于</div>
      <div style="font-size: 12px; color: var(--text-muted); line-height: 1.8;">
        <div>AI 用量监控 v1.0.0 (Tauri)</div>
        <div>支持：Kimi · 智谱 GLM · MiniMax · DeepSeek · 自定义</div>
        <div>数据仅存储在本地</div>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
